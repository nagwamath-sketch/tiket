<style>
:root{--ink:#0B1428;--gold:#D4B06A;--dgold:#9A7A3A;--ivory:#EFE7D6;--paper:#E3DCCB;--mist:#8FA3BF;--grey:#5B6478}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Taj,system-ui,sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
header{text-align:center;margin-bottom:10px}
.kicker{font-family:Mono,monospace;letter-spacing:.32em;font-size:11px;color:var(--dgold);direction:ltr}
h1{font-family:Kufi;font-weight:400;font-size:clamp(26px,4vw,38px);margin-top:6px}
.wrap{width:min(1180px,100%)}
#ticket{width:100%;height:auto;display:block}
.panel{margin:6px auto 0;width:min(620px,100%);background:var(--ink);color:var(--ivory);border-radius:18px;padding:26px 26px 22px;position:relative;box-shadow:0 14px 34px rgba(42,36,22,.22)}
.panel::before{content:"";position:absolute;inset:10px;border:1px solid rgba(212,176,106,.3);border-radius:12px;pointer-events:none}
.panel h2{font-family:Kufi;font-weight:400;font-size:24px;color:var(--gold);margin-bottom:4px}
.panel p{color:var(--mist);font-size:16px;margin-bottom:18px}
label{display:block;font-size:15px;color:var(--mist);margin:0 0 6px}
input[type=text]{width:100%;font-family:Taj;font-weight:500;font-size:22px;padding:12px 16px;border-radius:10px;border:1px solid rgba(143,163,191,.4);background:#13213D;color:var(--ivory);outline:none}
input[type=text]:focus{border-color:var(--gold)}
.seg{display:flex;gap:10px;margin:16px 0 20px}
.seg button{flex:1;font-family:Taj;font-weight:500;font-size:18px;padding:10px;border-radius:10px;border:1px solid rgba(143,163,191,.4);background:transparent;color:var(--mist);cursor:pointer;transition:.2s}
.seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.go{width:100%;font-family:Kufi;font-size:22px;padding:14px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;transition:transform .15s, box-shadow .2s;position:relative;z-index:1}
.go:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(212,176,106,.35)}
.go:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.ghost{background:transparent;color:var(--gold);border:1px solid rgba(212,176,106,.6);margin-top:10px;font-size:18px;padding:11px}
.row{display:flex;gap:10px;position:relative;z-index:1}
.row .go{flex:1}
.msg{min-height:22px;margin-top:12px;color:var(--gold);font-size:15px;text-align:center;position:relative;z-index:1}
.reveal h2{text-align:center}
.reveal .big{font-family:Kufi;font-size:clamp(36px,7vw,56px);text-align:center;color:var(--ivory);margin:4px 0 4px}
.reveal p{text-align:center}
.hidden{display:none}
footer{margin-top:22px;text-align:center;font-family:Mono,monospace;font-size:10px;letter-spacing:.3em;color:var(--grey);direction:ltr}
/* ticket animation */
#ticket .stg{opacity:1;transition:opacity .4s}
#ticket.sealed .stg{opacity:0}
#ticket.sealed #core{opacity:.35}
#ticket.play .stg{animation:pop .5s both;animation-delay:calc(var(--d)*.38s + .2s)}
#ticket.play #core{animation:pulse 1.4s 2.4s both}
#ticket.play #gpath{animation:draw 2.5s cubic-bezier(.6,.05,.3,1) both}
#lakab{transition:opacity .9s}
#ticket.play #lakab{animation:fade 1.1s 2.6s both}
@keyframes draw{from{stroke-dashoffset:538}to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
#ticket .stg{transform-box:fill-box;transform-origin:center}
#core{transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.35;transform:scale(1)}40%{opacity:1;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#ticket.play *{animation:none!important}}
</style>
</head>

<section class="panel" id="formPanel">

    <input type="text" id="name" maxlength="32" autocomplete="name" placeholder="مثال: أ. مريم أحمد" required>
    <div class="seg" role="group" aria-label="معلم أو معلمة">
      <button type="button" data-g="f" class="on">معلمة</button>

    <button class="go" type="submit" id="goBtn">انطلق في الرحلة ✦</button>
  </form>
</section>

  <div class="row">
    <button class="go" id="saveBtn">حفظ التذكرة صورة</button>
  </div>

<script>
const NAMES = {
  f: ["زهرة العُلا","نجمة السماء","قمر المعرفة","لؤلؤة الخليج","نسمة الصباح","شمس الإبداع","ياسمينة الفكر","فراشة الأفكار","غيمة العطاء","ريحانة العلم","درّة المعلمات","أميرة البيان","سنا البرق","قطرة الندى","وردة الأمل","نجمة الشمال","بلسم القلوب","شعلة الإلهام","رائدة المستقبل","جوهرة الصف","ملكة الإبداع","نجمة الصباح","ضياء القمر","غصن البان","شمعة الدرب","أيقونة التميز","منارة العلم","ريشة الإبداع","عبير الورد","نخلة العطاء","بوصلة الرحلة","مشكاة النور","سفيرة التميز","نورة الأفق","ربّانة الرحلة","فجر الأمل","زنبقة الفكر","حديقة الأفكار","مجرّة الإبداع","قافلة النور"],
  m: ["فارس المعرفة","نجم الشمال","بدر التمام","صقر الإبداع","ربّان الرحلة","سيف البيان","منار العلم","شهاب الأفكار","رائد المستقبل","بحّار الخيال","فارس الكلمة","أمير البيان","نسر القمم","برق الإلهام","ضياء الدرب","شعاع الأمل","حارس الضوء","مهندس الأفكار","ملّاح النجوم","فجر الإبداع","صانع الأمل","غيث الخير","قبطان المعرفة","سفير التميز","نجم الصباح","ليث الإبداع","مِشعل الطريق","كوكب المعرفة","جسر الأفكار","قمر الليالي"]
};
const LINES = {
  f: ["تستحقينه لأنكِ تنيرين الطريق لطالباتك وطلابك.","لأن الفضول هو أول محطة في كل رحلة.","مرحباً بكِ على متن الرحلة — المقعد محجوز باسمك."],
  m: ["تستحقه لأنك تنير الطريق لطلابك.","لأن الفضول هو أول محطة في كل رحلة.","مرحباً بك على متن الرحلة — المقعد محجوز باسمك."]
};
const AR = d => String(d).replace(/\d/g, c => "٠١٢٣٤٥٦٧٨٩"[c]);
const $ = id => document.getElementById(id);
const svg = $("ticket");
let gender = "f", state = null;

const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ai-ticket") || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem("ai-ticket", JSON.stringify(v)); } catch(e){} }
};

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
  gender = b.dataset.g;
});

function fit(el, maxW, base){
  el.setAttribute("font-size", base);
  let s = base;
  while (el.getComputedTextLength() > maxW && s > 14){ s -= 1; el.setAttribute("font-size", s); }
}

function pick(g, avoid){
  const list = NAMES[g].filter(n => n !== avoid);
  return list[Math.floor(Math.random()*list.length)];
}

function render(st, animate){
  const fem = st.g === "f";
  $("lblHolder").textContent = fem ? "حاملة التذكرة" : "حامل التذكرة";
  $("lblLakab").textContent = fem ? "لقبكِ في الرحلة" : "لقبك في الرحلة";
  $("holder").textContent = st.name;
  $("lakab").textContent = st.lakab;
  $("tno").textContent = "N° " + String(st.no).padStart(3, "0");
  fit($("holder"), 380, 30);
  fit($("lakab"), 380, 50);
  $("revTitle").textContent = fem ? "لقبكِ في الرحلة" : "لقبك في الرحلة";
  $("revLakab").textContent = st.lakab;
  $("revLine").textContent = LINES[st.g][st.no % 3];
  $("formPanel").classList.add("hidden");
  $("revealPanel").classList.remove("hidden");
  svg.classList.remove("sealed");
  if (animate){ svg.classList.remove("play"); void svg.getBoundingClientRect(); svg.classList.add("play"); }
}

$("f").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("name").value.trim().replace(/\s+/g, " ");
  if (!name) return;
  state = { name, g: gender, lakab: pick(gender), no: 1 + Math.floor(Math.random()*999) };
  store.set(state);
  render(state, true);
  svg.scrollIntoView({behavior:"smooth", block:"center"});
});

$("againBtn").onclick = () => {
  state.lakab = pick(state.g, state.lakab);
  store.set(state);
  render(state, true);
  $("msg").textContent = "";
};

// ---------- save as PNG ----------
let downloads = null;
(async () => {
  try { if (window.claude && claude.use) downloads = await claude.use("downloads"); } catch(e){}
})();

async function ticketPNG(){
  await document.fonts.ready;
  const clone = svg.cloneNode(true);
  clone.removeAttribute("class");
  clone.setAttribute("width", 3800); clone.setAttribute("height", 1560);
  const st = document.createElementNS("http://www.w3.org/2000/svg", "style");
  st.textContent = $("fontcss").textContent;
  clone.insertBefore(st, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], {type:"image/svg+xml"}));
  const img = new Image();
  await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url; });
  await new Promise(r => setTimeout(r, 120));
  const c = document.createElement("canvas"); c.width = 3800; c.height = 1560;
  c.getContext("2d").drawImage(img, 0, 0, 3800, 1560);
  URL.revokeObjectURL(url);
  return await new Promise(r => c.toBlob(r, "image/png"));
}

$("saveBtn").onclick = async () => {
  const msg = $("msg");
  if (!downloads){ msg.textContent = "الحفظ غير متاح هنا — التقط صورة للشاشة للاحتفاظ بتذكرتك."; return; }
  msg.textContent = "جارٍ تجهيز التذكرة…";
  try {
    const blob = await ticketPNG();
    await downloads.save({ filename: "تذكرة-رحلة-في-عالم-AI.png", data: blob });
    msg.textContent = "تم حفظ التذكرة ✦ نراك في الرحلة!";
  } catch(e){
    msg.textContent = (e && e.code === "declined") ? "" : "تعذّر الحفظ — التقط صورة للشاشة للاحتفاظ بتذكرتك.";
  }
};

// restore
const saved = store.get();
if (saved && saved.name){ state = saved; render(state, false); }
else svg.classList.add("sealed");
</script>
